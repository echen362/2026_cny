<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 马年大吉 🐴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
            background: linear-gradient(135deg, #d32f2f 0%, #c62828 50%, #b71c1c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 10px;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 5px 5px 10px 5px;
                align-items: flex-start;
                padding-top: 10px;
            }

            .container {
                padding: 5px;
                max-width: 100%;
            }

            .lantern {
                width: 70px;
                height: 90px;
                margin: 0 auto 10px;
            }

            .lantern-top {
                width: 40px;
                height: 15px;
            }

            .lantern-top::before {
                width: 6px;
                height: 12px;
                top: -12px;
            }

            .lantern-body {
                width: 70px;
                height: 55px;
            }

            .lantern-body::before {
                font-size: 28px;
            }

            .lantern-bottom {
                width: 40px;
                height: 15px;
            }

            .tassel {
                width: 2px;
                height: 30px;
            }

            .tassel-end {
                width: 20px;
                height: 20px;
            }

            .year-text {
                font-size: 32px;
                margin: 10px 0 8px 0;
            }

            .horse-container {
                gap: 6px;
                margin: 10px 0;
            }

            .horse {
                font-size: 35px;
            }

            .button {
                padding: 10px 20px;
                font-size: 15px;
                margin: 10px 0 8px 0;
            }

            .greeting-text {
                font-size: 20px;
                margin: 10px 0;
                min-height: 60px;
                padding: 0 8px;
            }

            .greeting-content {
                font-size: 20px !important;
            }

            .subtitle {
                font-size: 11px;
                margin-top: 8px;
            }
        }

        /* Animated background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
            animation: patternMove 20s linear infinite;
        }

        @keyframes patternMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(70px, 70px); }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        .lantern {
            width: 180px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
            animation: swing 3s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .lantern-top {
            width: 80px;
            height: 30px;
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            margin: 0 auto;
            border-radius: 15px 15px 0 0;
            position: relative;
        }

        .lantern-top::before {
            content: '';
            width: 10px;
            height: 20px;
            background: #FFD700;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .lantern-body {
            width: 180px;
            height: 140px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #c92a2a 100%);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            box-shadow: 
                inset 0 -20px 30px rgba(0,0,0,0.2),
                0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .lantern-body::before {
            content: '福';
            font-size: 70px;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .lantern-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 50%);
        }

        .lantern-bottom {
            width: 80px;
            height: 30px;
            background: linear-gradient(to top, #FFD700, #FFA500);
            margin: 0 auto;
            border-radius: 0 0 15px 15px;
        }

        .tassel {
            width: 4px;
            height: 60px;
            background: linear-gradient(to bottom, #FFD700, #ff6b6b);
            margin: 0 auto;
        }

        .tassel-end {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ff6b6b 0%, #c92a2a 100%);
            margin: 0 auto;
            border-radius: 50%;
            position: relative;
            animation: tassleSwing 3s ease-in-out infinite;
        }

        @keyframes tassleSwing {
            0%, 100% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

        .year-text {
            font-size: 72px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 
                3px 3px 6px rgba(0,0,0,0.5),
                0 0 20px rgba(255,215,0,0.5);
            margin: 30px 0;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 6px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.5); }
            to { text-shadow: 3px 3px 6px rgba(0,0,0,0.5), 0 0 30px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.6); }
        }

        .horse-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            perspective: 1000px;
        }

        .horse {
            font-size: 80px;
            animation: bounce 1s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .horse:nth-child(1) {
            animation-delay: 0s;
        }

        .horse:nth-child(2) {
            animation-delay: 0.2s;
        }

        .horse:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .greeting-text {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            padding: 0 10px;
        }

        .greeting-content {
            opacity: 0;
            transform: scale(0.5) rotate(-10deg);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .button {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #c92a2a;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 8px 20px rgba(0,0,0,0.3),
                inset 0 -3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 25px rgba(0,0,0,0.4),
                inset 0 -3px 10px rgba(0,0,0,0.1);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.clicked::before {
            width: 300px;
            height: 300px;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-top: 20px;
            font-style: italic;
        }

        /* Fireworks */
        .firework {
            position: fixed;
            pointer-events: none;
        }

        .firework-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Floating decorations */
        .decoration {
            position: fixed;
            font-size: 30px;
            animation: float 8s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
                opacity: 0.6;
            }
            50% { 
                transform: translateY(-30px) rotate(180deg);
                opacity: 0.9;
            }
        }

        .cloud {
            position: fixed;
            background: rgba(255,255,255,0.15);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255,255,255,0.8);
            animation: cloudFloat 15s linear infinite;
            pointer-events: none;
        }

        @keyframes cloudFloat {
            0% {
                transform: translateX(-100px);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 100px));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lantern">
            <div class="lantern-top"></div>
            <div class="lantern-body">
                <div class="lantern-pattern"></div>
            </div>
            <div class="lantern-bottom"></div>
            <div class="tassel"></div>
            <div class="tassel-end"></div>
        </div>

        <div class="year-text">2026</div>

        <div class="horse-container">
            <div class="horse">🐴</div>
            <div class="horse">🐴</div>
            <div class="horse">🐴</div>
        </div>

        <button class="button" id="greetingButton">
            点击您的专属祝福
        </button>

        <div class="greeting-text" id="greetingText">
            <div class="greeting-content" style="opacity: 0.6; font-size: 16px;">
                马儿正在思考中...<br/>🐴💭
            </div>
        </div>

        <div class="subtitle">马年行大运 · 万事马到功成</div>
    </div>

    <script>
        const greetings = [
            "马上有钱💰\n钞票多到数不完！",
            "一马当先🏆\n今年你就是C位！",
            "马到成功🎯\n考试全过老板加薪！",
            "龙马精神✨\n天天精力旺到爆表！",
            "快马加鞭🚀\n升职加薪快到飞起！",
            "万马奔腾🌟\n好运如潮水般涌来！",
            "马上发财🤑\n存款多个零不是梦！",
            "马不停蹄💪\n健身不累还瘦十斤！",
            "老马识途🧭\n找对象一找一个准！",
            "马上有对象💕\n脱单就在今年啦！",
            "马力全开🔥\n工作效率×10倍！",
            "一马平川🌈\n前路坦荡无阻碍！",
            "马上暴富💎\n彩票中奖就是你！",
            "马上变美🌸\n天天都是颜值巅峰！",
            "马上有房🏠\n别墅豪宅随便挑！",
            "马上有车🚗\n豪车任你开回家！",
            "马照跑舞照跳🎉\n吃啥都不会胖！",
            "马到福来🎁\n好事成双福气满！",
            "马上开心😊\n烦恼全部Say Goodbye！",
            "马上好运💫\n霉运通通滚远点！",
            "马上升官👑\n当上CEO指日可待！",
            "马蹄声声催财来💰\n红包收到手软！",
            "马背驮着幸福来🎊\n快乐365天不打烊！",
            "马上心想事成🌟\n许愿就灵验！",
            "马步稳健事业旺📈\n业绩蹭蹭往上涨！",
            "马儿奔跑载好运🍀\n幸运女神就是你！",
            "马上桃花朵朵开💐\n追你的人排长队！",
            "马到福音传喜讯📣\n天天都有好消息！",
            "马年大吉样样顺🎯\n事事如意步步高！",
            "马蹄哒哒响钱来🪙\n财神爷点名找你！"
        ];

        const placeholders = [
            "马儿正在思考中...\n🐴💭",
            "祝福加载中...\n请稍候哦~ ✨",
            "福气正在赶来的路上...\n🏃‍♂️💨",
            "马儿在配置你的好运...\n⚙️🍀",
            "正在召唤财神爷...\n🙏💰",
            "好运值计算中...\n📊📈",
            "马年祝福生成器启动中...\n🚀✨"
        ];

        const sassyResponses = [
            "我的祝福也不是那么廉价\n不要无节制的点我哈哈哈😤",
            "喂喂喂！点这么快\n我的马蹄都要冒烟了🔥",
            "慢着慢着！\n好运也需要时间酝酿的好吧✋",
            "你这是在薅羊毛吗？\n祝福库存告急啦！📦",
            "马儿累了需要休息\n给我喝口水再说🐴💧",
            "别点了别点了\n福气也会被点没的！😅",
            "emmm...你是想把\n今年的好运一次用完？🤔",
            "马老板说了\n祝福限购！每人限量供应！⚠️",
            "哎呀妈呀\n你的手速是练过的吧🤯",
            "慢点慢点！\n让其他人也有机会嘛~😏"
        ];

        const button = document.getElementById('greetingButton');
        const greetingText = document.getElementById('greetingText');
        let lastGreeting = -1;
        let placeholderIndex = 0;
        let clickCount = 0; // Track number of clicks

        // Rotate placeholder messages
        function updatePlaceholder() {
            if (greetingText.querySelector('.greeting-content').textContent.includes('思考中') ||
                greetingText.querySelector('.greeting-content').textContent.includes('加载中') ||
                greetingText.querySelector('.greeting-content').textContent.includes('赶来') ||
                greetingText.querySelector('.greeting-content').textContent.includes('配置') ||
                greetingText.querySelector('.greeting-content').textContent.includes('召唤') ||
                greetingText.querySelector('.greeting-content').textContent.includes('计算中') ||
                greetingText.querySelector('.greeting-content').textContent.includes('启动中')) {
                placeholderIndex = (placeholderIndex + 1) % placeholders.length;
                const content = greetingText.querySelector('.greeting-content');
                content.style.opacity = '0.6';
                // Set font size based on screen width
                if (window.innerWidth <= 768) {
                    content.style.fontSize = '16px';
                } else {
                    content.style.fontSize = '28px';
                }
                content.innerHTML = placeholders[placeholderIndex].replace(/\n/g, '<br/>');
            }
        }

        // Rotate placeholders every 3 seconds
        setInterval(updatePlaceholder, 3000);

        button.addEventListener('click', function(e) {
            // Button animation
            this.classList.add('clicked');
            setTimeout(() => this.classList.remove('clicked'), 600);

            clickCount++;

            // Decide whether to show greeting or sassy response
            // First click always gets a greeting
            // After that, 20% chance of sassy response
            let showSassy = clickCount > 1 && Math.random() < 0.2;
            
            let messageToShow;
            if (showSassy) {
                // Random sassy response
                const sassyIndex = Math.floor(Math.random() * sassyResponses.length);
                messageToShow = sassyResponses[sassyIndex];
            } else {
                // Get random greeting (different from last one)
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * greetings.length);
                } while (randomIndex === lastGreeting);
                lastGreeting = randomIndex;
                messageToShow = greetings[randomIndex];
            }

            // Update greeting with animation
            const newContent = document.createElement('div');
            newContent.className = 'greeting-content';
            newContent.style.opacity = '1';
            // Set font size based on screen width
            if (window.innerWidth <= 768) {
                newContent.style.fontSize = '20px';
            } else {
                newContent.style.fontSize = '48px';
            }
            newContent.innerHTML = messageToShow.replace(/\n/g, '<br/>');
            
            greetingText.innerHTML = '';
            greetingText.appendChild(newContent);

            // Create fireworks
            createFireworks(e.clientX, e.clientY);

            // Play sound effect (if available)
            playSound();
        });

        function createFireworks(x, y) {
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#FF69B4', '#FFA500', '#98D8C8'];
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            document.body.appendChild(firework);

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / 20;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                firework.appendChild(particle);
            }

            setTimeout(() => firework.remove(), 1000);
        }

        function playSound() {
            // Create a simple beep sound using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // Create floating decorations
        function createDecorations() {
            const decorations = ['🎋', '🏮', '🎎', '✨', '🌸', '💮', '🎊', '🎉'];
            const container = document.body;

            for (let i = 0; i < 15; i++) {
                const decoration = document.createElement('div');
                decoration.className = 'decoration';
                decoration.textContent = decorations[Math.floor(Math.random() * decorations.length)];
                decoration.style.left = Math.random() * 100 + '%';
                decoration.style.top = Math.random() * 100 + '%';
                decoration.style.animationDelay = Math.random() * 5 + 's';
                decoration.style.animationDuration = (8 + Math.random() * 4) + 's';
                container.appendChild(decoration);
            }
        }

        // Create floating clouds with text
        function createClouds() {
            const cloudTexts = ['福', '喜', '财', '禄', '寿'];
            
            setInterval(() => {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.textContent = cloudTexts[Math.floor(Math.random() * cloudTexts.length)];
                cloud.style.top = (Math.random() * 80 + 10) + '%';
                cloud.style.animationDuration = (15 + Math.random() * 10) + 's';
                document.body.appendChild(cloud);

                setTimeout(() => cloud.remove(), 25000);
            }, 5000);
        }

        // Initialize
        createDecorations();
        createClouds();
    </script>
</body>
</html>
